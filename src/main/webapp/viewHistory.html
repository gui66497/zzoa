<body>
<div ng-controller="viewHistoryController as controller">
        <table ng-table="controller.tableParams" align="center" class="table table-bordered table-striped table-condensed">
            <thead>
            <tr>
                <td width="6%">序号</td>
                <td width="15%">流程节点</td>
                <td width="10%">处理人</td>
                <td width="20%">开始时间</td>
                <td width="20%">结束时间</td>
                <td width="6%">操作</td>
                <td width="23%">原因</td>

            </tr>
            </thead>
            <tbody>
            <tr ng-repeat="history in viewHistory" class="contentTr">
                <td width="6%">{{$index+1}}</td>
                <td width="15%">{{history.actName}}</td>
                <td width="10%">{{history.assignee}}</td>
                <td width="20%">{{formatter(history.startTime)}}</td>
                <td width="20%">{{formatter(history.endTime)}}</td>
                <td width="6%" ng-switch="history.option">
                    <span ng-switch-when="agree">同意</span>
                    <span ng-switch-when="disagree">打回</span>
                    <span ng-switch-default></span>
                </td>
                <td width="23%">{{history.reason}}</td>
            </tr>
            </tbody>
        </table>
</div>

</body>
