<style type="text/css">
    td {
        border: 0px solid #c0c0c0;
        border-collapse: collapse;
        font-size: 14px;
        text-align: center;
    }

    tr {
        border-bottom: none !important;
        border-left: 0px;
        border-right: 0px;
        border-top: 0px;
        border-collapse: collapse;
        height: 40px;
    }

    thead td {
        font-size: 14px;
        font-weight: bold;
    }

    #roleInfoTable tr {
        border: 0px solid #FFF;
    }

    #roleInfoTable td {
        border: 0px solid #FFF;
    }

    #userEditTable tr, td {
        border: 0px solid #FFF;
    }

    #userAddTable tr, td {
        border: 0px solid #FFF;
    }

    .mu li {
        font-family: 微软雅黑;
        font-size: 16px;
        list-style: none;
        line-height: 39px;
        cursor: hand;
        text-align: center
    }

    .mu li:hover {
        background-color: #DEE2E7;
        border-radius: 3px
    }
    .applyBtn {
        margin-right: 10px;
        width: 150px;
        height: 34px;
        background-color: #4dbd73;
        font-family: 微软雅黑;
        font-size: 14px;
        color: #fff;
        border: 0px;
        border-radius: 4px;
        margin-bottom: 10px;
    }
    .start:after{
        display: inline-block;
        content: "*";
        color: red;
    }
    #overMonth{
        width: 200px;
        padding: 6.5px 0 6.5px 10px;
        border-radius: 5px;
        border: 1px solid rgb(204,204,204);
        outline:none;
        float: right;
        margin-right: 10px;
    }
    .overBtn {
        width: 100px;
        height: 34px;
        background-color: #4dbd73;
        font-family: 微软雅黑;
        font-size: 14px;
        color: #fff;
        border: 0px;
        border-radius: 4px;
        float: right;
    }
    .cover{
        width:100%;
        height:100%;
        background-color: rgb(255,255,255);
        opacity: 0.5;
        position: absolute;
        z-index:99999;
        left:0px;
        top:0px;
    }

</style>
<div ng-controller="overController as controller" style="height: 100%;">
    <div class="cover" ng-if="hideFrom">
        <img src="images/loading.gif" style="position: relative;top: 50%;left: 50%;margin-top: -21px;margin-left: -32px;">
    </div>
    <div style="margin-top: 10px;height: 100%;">
        <button class="add information" ng-click="addAndUpdateOver()" type="button">
            <span class="glyphicon glyphicon-plus"></span> 加班申请
        </button>
        <div class="form-inline" style="float: right;margin-bottom: 10px;">
            <input class="form-control" style="width: 200px;vertical-align:bottom;" id="over_range" name="out_range">
            <button class="searchBtn" ng-click="search()" type="button"><span class="glyphicon glyphicon-search"></span> 查询</button>
        </div>
        <!--<button class="overBtn" ng-click="search()" type="button"><span class="glyphicon glyphicon-plus"></span>查询</button>
        <input type="month" id="overMonth" ng-model="searchTime" value=""/>-->
        <div ng-show="noNum" style="width: 100%;height: 400px;">
            <div style="width:100%;height: 280px;"><img src="./images/none220x160.png" style="position: relative;left: 50%;margin-left: -110px;top: 100px;"></div>
            <div style="font-size: 16px;text-align: center;color: #999;">当前页面无数据~</div>
        </div>
        <table ng-show="noContent" ng-table="controller.tableParams" id="overListTable" align="center"
               class="table table-bordered table-striped table-condensed" style="height: calc(100% - 200px);display: block;margin-top: 15px;">
            <thead style="display: table;width: calc( 100% - 17px );table-layout:fixed;">
            <tr style="display: table;width:100%;table-layout:fixed;">
                <td width="10%">序号</td>
                <td width="8%">用户名</td>
                <td width="20%">加班日期</td>
                <td width="20%">加班时间</td>
                <td width="20%">创建时间</td>
                <td width="7%">状态</td>
                <td width="15%">操作</td>
            </tr>
            </thead>
            <tbody style="display: block;height: calc(100% - 40px);overflow-y:scroll;width: 100%;">
            <tr ng-repeat="row in $data" class="contentTr" style="display: table;width:100%;table-layout:fixed;">
                <td width="0%" ng-hide="true">{{row.actId}}</td>
                <td width="10%">{{row.id}}</td>
                <td width="8%">{{row.userName}}</td>
                <td width="20%">{{row.overDate}}</td>
                <td width="20%">{{row.overDay}}</td>
                <td width="20%">{{row.createTime | limitTo:19}}</td>
                <td width="7%" ng-switch="row.status">
                    <span ng-switch-when="00">待发起</span>
                    <span ng-switch-when="01">处理中</span>
                    <span ng-switch-when="02">打回中</span>
                    <span ng-switch-when="03">已打回</span>
                    <span ng-switch-when="93">已打回(已忽略)</span>
                    <span ng-switch-when="97">已打印</span>
                    <span ng-switch-when="99">已通过</span>
                    <span ng-switch-default>未知</span>
                </td>
                <td width="15%">
                    <button type="button" title="修改" class="editBtn" ng-click="addAndUpdateOver($index)"></button>
                    <button type="button" title="撤销" class="revokeBtn" ng-click="showRevokeOver($index)"></button>
                    <button type="button" title="删除" class="deleteBtn" ng-click="showDeleteOver($index)"></button>
                    <button type="button" title="查看历史" class="lookBtn" ng-click="viewHistoryOver($index)"></button>
                    <button type="button" title="导出" class="downBtn" ng-click="downLoadOver($index)"></button>
                </td>

            </tr>
            </tbody>
        </table>
    </div>
    <!--加班申请模态框-->
    <div class="modal fade" id="addAndUpdateOverModal" tabindex="-1" role="dialog" >
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="closeTable" data-dismiss="modal" aria-label="Close"></button>
                    <h4 class="modal-title" style="font-weight: 700;">加班申请</h4>
                </div>
                <div class="modal-body" style="height: 220px;">
                    <form class="form-horizontal" name="overAddForm">
                        <table width="90%">
                            <tr>
                                <td width="30%" class="start" style="font-weight: 700;">加班日期:</td>
                                <td width="70%">
                                    <div class="dropdown">
                                        <a class="dropdown-toggle" id="dropdown" role="button" data-toggle="dropdown"
                                           data-target="#">
                                            <div class="input-group">
                                                <input type="text" id="overDate" name="overDate" class="form-control"
                                                       data-ng-model="formData.overDate" disabled="disabled"
                                                       style="cursor: pointer" required>
                                                <span class="input-group-addon"><i
                                                        class="glyphicon glyphicon-calendar"></i></span>
                                            </div>
                                        </a>
                                        <ul class="dropdown-menu" role="menu" aria-labelledby="dLabel">
                                            <datetimepicker data-ng-model="formData.overDate"
                                                            data-datetimepicker-config="{ dropdownSelector: '#dropdown',  minView:'day' }"
                                                            data-on-set-time="onTimeSet(newDate, oldDate)"></datetimepicker>
                                        </ul>
                                    </div>
                                </td>
                            </tr>

                            <tr>
                                <td width="30%" class="start" style="font-weight: 700;">加班时间:</td>
                                <td width="70%">
                                    <select id="overDay" name="overDay" class="applySelect form-control" ng-model="formData.overDay" required="required">
                                        <option value="0.5">0.5天</option>
                                        <option value="1">1天</option>
                                        <option value="1.5">1.5天</option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <td width="30%" style="font-weight: 700;padding-right: 7px;">加班原因:</td>
                                <td width="70%"> <textarea class=" form-control" ng-model="formData.reason"
                                                           style="float:right;" ng-click="asdfg()"></textarea>
                                </td>
                            </tr>
                        </table>
                    </form>

                    <div class="noneDiv"></div>
                    <div class="modal-footer">
                        <button type="button" class="cancel" data-dismiss="modal">取消</button>
                        <button type="button" class="sure" ng-disabled="overAddForm.overDate.$invalid ||overAddForm.overDay.$invalid"
                                ng-click="saveAndSubmitOver()">保存提交</button>
                    </div>

                </div>
            </div>
        </div>

    </div>

    <div class="modal fade" id="overChooseModal" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="closeTable" data-dismiss="modal" aria-label="Close"></button>
                    <h4 class="modal-title">处理人选择</h4>
                </div>
                <div class="modal-body apply" style="max-height: 450px;overflow-y: auto">
                    <h4 style="padding-left: 1rem;">
                        <div class="opt" ng-repeat="x in formData.processors" style="float:left;width:25%;">
                            <input class="magic-radio" ng-change="radioChange()" type="radio" id="ov{{x.staffId}}" name="radio" value="{{x.staffId}}" data-ng-model="formData.processor">
                            <label for="ov{{x.staffId}}" id="over{{x.staffId}}" style="font-weight: 500;">{{x.name}}</label>
                        </div>
                    </h4>
                </div>
                <div class="modal-footer">
                    <button type="button" class="cancel" data-dismiss="modal">取消</button>
                    <button type="button" class="sure" ng-click="submitOver()"  ng-disabled="disSub">提交</button>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    $(function(){
        $(".modal").draggable({cursor: "move", handle: ".modal-header"});
    });
</script>
