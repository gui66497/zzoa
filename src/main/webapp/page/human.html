<style type="text/css">
    /*input[type="password"] {
        width: 240px;
        margin-left: 30px;
        margin-top: 11px;
    }

    input[type="text"] {
        width: 240px;
        margin-left: 30px;
        margin-top: 11px;
    }*/
    treecontrol ul{
        font-size: 15px;
    }
    .c-iExpanded{
        background: url("../images/icons/person_li.png");
    }
    .tab-content{
        height:100%;
        padding: 44px 0 0 0;
        padding-right: 30px;
        padding-left: 30px;
    }
    .tab-content>.active{
        height:calc(100% - 20px);
    }
    .nav-tabs{
        background: #d4e0ef;
        border-bottom: none;
        position: fixed;
        width: calc(100% - 230px);
        z-index:900;
    }
    .nav-tabs>li.active>a, .nav-tabs>li.active>a:focus, .nav-tabs>li.active>a:hover {
        color: #555;
        cursor: default;
        border: 1px solid #ddd;
        border-bottom-color: transparent;
    }
    .rightDiv{
        width: 100%;
        padding: 80px 0px 0 229px;
        transition: 1s;
    }
    .tree-boot{
        color:#dcf9ff;
    }
    #style>li.active ,#style>li.active:focus,#style>li.active:hover{
        background: white;
    }
    #style>li>a{
        text-decoration: none;
    }
    button.close{
        margin-top: 10px;
        margin-right: 5px;
    }
    #首页{
        display: none;
    }
    .tabs{
        width:100px;
        float:left;
        text-align: center;
        height: 39px;
        margin-top: 5px;
        border-radius: 6px 6px 0 0;
        line-height: 39px;
        margin-right: 5px;
    }
    .tabs:hover{
        background:  rgb(238,238,238);
    }
    .telescopic{
        width: 9px;
        height: 100%;
        background: rgb(39, 125, 146);
        float: left;
        position: fixed;
        top: 80px;
        left: 220px;
        transition: 1s;
    }
    .leftDiv{
        left:0;
        transition: 1s;
    }
    .retractLeft{
        left:-220px;
    }
    .retractBtn{
        left:0;
    }
    .retractRight{
        padding: 80px 0px 0 9px;
    }
    .rightBtn{
        width: 9px;
        height: 41px;
        background: url('./images/right.gif');
        position: relative;
        top:50%;
        margin-top: -20px;
    }
    .rightBtn:hover{
        cursor: pointer;
    }
    .firstFloor{
        height: 16px;
        padding: 1px 10px;
        margin: 4px;
        float: left;
        position: relative;
        top: -2px;
    }
    .floor200{
        background: url(./images/icons/personnel_16x16.png) no-repeat;
    }
    .floor220{
        background: url(./images/icons/personnel_16x16.png) no-repeat;
    }
    .floor230{
        background: url('./images/xitong.png') no-repeat;
    }
</style>
<div ng-controller="humanController" style="height: 100%;">
    <div class="cover" ng-if="hideFrom">
        <img src="images/loading.gif" style="position: relative;top: 50%;left: 50%;margin-top: -21px;margin-left: -32px;">
    </div>
    <div style="height: 100%;">
        <div class="leftDiv" ng-class="{'retractLeft':isRetractBtn}">
            <treecontrol class="tree-boot"
                         tree-model="treeData1"
                         options="treeOptions"
                         on-selection="nodeSelect(node)"
                         selected-node="node1"
                         expanded-nodes="expandedNodes"
                         ng-show="page">
                {{node.name}}
            </treecontrol>
            <treecontrol class="tree-boot"
                         tree-model="treeData"
                         options="treeOptions"
                         on-selection="nodeSelect(node)"
                         selected-node="node1"
                         expanded-nodes="expandedNodes">
                <span ng-show="{{node.show}}" class="firstFloor floor{{node.id}}"></span>
                {{node.name}}
            </treecontrol>

        </div>
        <div class="telescopic" ng-click="telescopicBtn()" ng-class="{'retractBtn':isRetractBtn}">
            <div class="rightBtn"></div>
        </div>

        <div class="rightDiv" ng-class="{'retractRight':isRetractBtn}" style="height: 100%;">
            <form id="outerForm" name="outerForm" class="tab-form-demo"  style="height: 100%;">
                <uib-tabset active="activeIndex" style="height: 100%;">
                    <div style="float:left;background: #d4e0ef;width: 21px;height: 40px;">
                        <img src="images/left_16x16.png" style="padding: 12px 2.5px;" ng-show="leftRight" ng-click="left()"/>
                    </div>

                    <div id="style2" style="float:left;width: calc(100% - 42px);height: 44px;overflow:hidden;">
                        <div id="style" ng-style="moveStyle">
                            <uib-tab ng-repeat="content in contents" index="content.id" heading="{{content.name}}" ng-show="!content.show" id="{{content.id}}" class="tabs">
                                <div ng-include="content.url" autoscroll="true" style="height: 100%;">
                                </div>
                            </uib-tab>
                        </div>
                    </div>

                    <div style="float:right;background: #d4e0ef;width: 21px;height: 40px;">
                        <img src="images/right_16x16.png" style="padding: 12px 2.5px;" ng-show="leftRight" ng-click="right()"/>
                    </div>
                </uib-tabset>
            </form>

        </div>
    </div>

    <div class="modal fade" id="backupRestoreModal" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="closeTable" data-dismiss="modal" aria-label="Close" ng-click="cancel()"></button>
                    <h4 class="modal-title">备份还原</h4>
                </div>
                <div class="modal-body" style="max-height: 450px;overflow-y: auto">
                    <div>
                        <span style="width: 20%;text-align: right;display: inline-block;font-size: 16px;">备份还原:</span>
                        <span style="width: 70%;display: inline-block;font-size: 16px;">
                            <label class="radio-inline" style="margin: 0 10px;">
                                <input style="width: 15px;height: 15px;" type="radio" name="radio_vacation" value="0" ng-model="choice" class="radio_vacation" ng-change="changeStyle()" />备份
                            </label>
                            <label class="radio-inline">
                                <input style="width: 15px;height: 15px;" type="radio" name="radio_vacation" value="1" ng-model="choice" class="radio_vacation" ng-change="changeStyle()" />还原
                            </label>
                        </span>
                    </div>
                    <div ng-show="restore">
                        <span style="width: 20%;text-align: right;display: inline-block;font-size: 16px;margin-top: 20px;">选择文件:</span>
                        <span style="width: 70%;display: inline-block;">
                            <select class="form-control" ng-model="papers">
                                <option ng-repeat="num in reduction" value="{{num.col}}">{{num.col}}</option>
                            </select>
                        </span>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="cancel" data-dismiss="modal" ng-click="cancel()">取消</button>
                    <button type="button" class="sure" ng-click="submitBackupRestore()">提交</button>
                </div>
            </div>
        </div>
    </div>

</div>
<script>
    $(function(){
        $(".modal").draggable({cursor: "move", handle: ".modal-header"});
    });
</script>
