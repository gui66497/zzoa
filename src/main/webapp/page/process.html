<style type="text/css">
    td {
        border: 0px solid #c0c0c0;
        border-collapse: collapse;
        font-size: 14px;
        text-align: center;
    }

    tr {
        border-bottom: none !important;
        border-left: 0px;
        border-right: 0px;
        border-top: 0px;
        border-collapse: collapse;
        height: 40px;
    }

    thead td {
        font-size: 14px;
        font-weight: bold;
    }

    #roleInfoTable tr {
        border: 0px solid #FFF;
    }

    #roleInfoTable td {
        border: 0px solid #FFF;
    }

    #userEditTable tr, td {
        border: 0px solid #FFF;
    }

    #userAddTable tr, td {
        border: 0px solid #FFF;
    }

    .mu li {
        font-family: 微软雅黑;
        font-size: 16px;
        list-style: none;
        line-height: 39px;
        cursor: hand;
        text-align: center
    }

    .mu li:hover {
        background-color: #DEE2E7;
        border-radius: 3px
    }

    .addBtn {
        margin-right: 10px;
        padding: 0 15px;
        height: 34px;
        background-color: #4dbd73;
        font-family: 微软雅黑;
        font-size: 14px;
        color: #fff;
        border: 0px;
        border-radius: 4px;
        margin-bottom: 10px;
    }
    .start:after{
        display: inline-block;
        content: "*";
        color: red;
    }
    .mySelect{
        margin-left: 10px;
        width: 300px;
        float: left;
    }
</style>
<div ng-controller="processController as controller" style="height: 100%;">
    <div style="margin-top: 10px;height: 100%;">
        <button class="addBtn" ng-click="addProcess()" type="button">
            <span class="glyphicon glyphicon-plus"></span> 新增流程配置
        </button>
        <div style="float: right;">
            <select ng-model="req.processSign" class="form-control" style="width: 200px;margin-right: 10px;float: left;">
                <option value="">选择流程标识</option>
                <option ng-repeat="x in nodeSections" value="{{x.processSign}}">{{x.processSign}}</option>
            </select>
            <input type="text" ng-model="req.nodeSign" placeholder="节点标识" class="form-control" ng-keyup="myKeyup($event)" style="width: 200px;margin-right: 10px;float: left;"/>
            <button class="addBtn" ng-click="autoQuery()" type="button" style="float:left;height: 34px">
                <span class="glyphicon glyphicon-search"></span> 查询
            </button>
        </div>
        <div ng-show="noNum" style="width: 100%;height: 400px;">
            <div style="width:100%;height: 280px;"><img src="./images/none220x160.png" style="position: relative;left: 50%;margin-left: -110px;top: 100px;"></div>
            <div style="font-size: 16px;text-align: center;color: #999;">当前页面无数据~</div>
        </div>
        <table ng-show="noContent" ng-table="controller.tableParams" id="processListTable" align="center"
               class="table table-bordered table-striped table-condensed" style="display: block;margin-top: 15px;height: calc(100% - 250px);">
            <thead style="display: table;width: calc( 100% - 17px );table-layout:fixed;">
            <tr style="display: table;width:100%;table-layout:fixed;">
                <td width="10%">序号</td>
                <td width="10%">流程编号</td>
                <td width="10%">流程标识</td>
                <td width="10%">节点编号</td>
                <td width="20%">节点标识</td>
                <!--<td width="10%">用户编号</td>-->
                <td width="10%">用户名称</td>
                <td width="10%">创建时间</td>
                <td width="10%">操作</td>
            </tr>
            </thead>
            <tbody style="display: block;height: calc(100% - 40px);overflow-y:scroll;width: 100%;">
            <tr ng-repeat="row in $data" class="contentTr" style="display: table;width:100%;table-layout:fixed;">
                <td width="0%" ng-hide="true">{{row.id}}</td>
                <td width="10%">{{$index+1+(req.paging.pageNo-1)*req.paging.pageSize}}</td>
                <td width="10%">{{row.processId}}</td>
                <td width="10%">{{row.processSign}}</td>
                <td width="10%">{{row.nodeId}}</td>
                <td width="20%">{{row.nodeSign}}</td>
                <!--<td width="10%">{{row.userId}}</td>-->
                <td width="10%">{{row.userName}}</td>
                <td width="10%">{{row.createTime}}</td>
                <td width="10%">
                    <button title="修改" class="editBtn" ng-click="updateProcess($index)" type="button"/>
                    <button title="删除" class="deleteBtn" ng-click="showDeleteProcess($index)" type="button"/>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!--字典项信息模态框-->
    <div class="modal fade" id="addProcessModal" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="closeTable" data-dismiss="modal" aria-label="Close"></button>
                    <h4 class="modal-title">流程信息</h4>
                </div>
                <div class="modal-body" style="height: 220px;">
                    <form class="form-horizontal" name="processAddForm">
                        <table width="90%">
                            <tr>
                                <td width="30%" style="text-align: right;font-weight: 700;padding-right: 47px;" >流程：<span style="color: red;">*</span></td>
                                <td width="70%">
                                    <select id="processId" name="processId" class="form-control" ng-model="formData.processId" required="required" style="float:left;width: 300px;margin: 0 10px;" ng-change="changeProcess()">
                                        <option id="processIds{{x.processId}}" ng-repeat="x in processSections" value="{{x.processId}}">{{x.processSign}}</option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <td width="30%" style="text-align: right;font-weight: 700;padding-right: 47px;" >节点：<span style="color: red;">*</span></td>
                                <td width="70%">
                                    <select id="nodeId" name="nodeId" class="form-control" ng-model="formData.nodeId" required="required" style="float:left;width: 300px;margin: 0 10px;">
                                        <option id="nodeIds{{x.nodeId}}" ng-repeat="x in nodeSections" value="{{x.nodeId}}">{{x.nodeSign}}</option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <td width="30%" style="text-align: right;font-weight: 700;padding-right: 47px;" >用户：<span style="color: red;">*</span></td>
                                <td width="70%">
                                    <ui-select id="userId" name="userId" class="mySelect" theme="bootstrap" ng-model="selected.value" on-select="onSelectStaff($item, $model)" required="required">
                                        <ui-select-match placeholder="请选择一位员工">
                                            <span ng-bind="$select.selected.name"></span>
                                        </ui-select-match>
                                        <ui-select-choices group-by="'departName'" repeat="item in (allStaff | filter: $select.search) track by item.id">
                                            <span ng-bind="item.name"></span>
                                        </ui-select-choices>
                                    </ui-select>
                                </td>
                            </tr>
                        </table>
                    </form>

                    <div class="noneDiv"></div>
                    <div class="modal-footer">
                        <button type="button" class="cancel" data-dismiss="modal">取消</button>
                        <button type="button" class="sure" ng-disabled="processAddForm.processId.$invalid ||processAddForm.nodeId.$invalid ||processAddForm.userId.$invalid"
                                ng-click="saveAndSubmitProcess()">保存提交</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    $(function(){
        $(".modal").draggable({cursor: "move", handle: ".modal-header"});
    });
</script>
