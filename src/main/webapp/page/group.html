<style type="text/css">
    .staff-li{
        background: #e6eaef;
        width: 74px;
        border-radius: 5px;
    }
</style>
<div ng-controller="groupController as groupController" style="height: 100%;">
    <div class="row" style="height: 100%;">
        <br>
        <button class="nomalBtn" ng-click="toAddGroup()" type="button">
            <span class="glyphicon glyphicon-plus"></span> 新增组
        </button>
        <div class="span8" style="margin-top: 15px;height: calc(100% - 100px);">
            <table ng-table="groupController.tableParams" align="center" class="table table-bordered table-striped table-condensed" style="display: block;margin-top: 15px;height: calc(100% - 150px);">
                <thead style="display: table;width: calc( 100% - 17px );table-layout:fixed;">
                <tr style="display: table;width:100%;table-layout:fixed;">
                    <td width="5%">序号</td>
                    <td width="15%">组名</td>
                    <td width="60%">成员</td>
                    <td width="15%">操作</td>
                </tr>
                </thead>
                <tbody style="display: block;height: calc(100% - 40px);overflow-y:scroll;width: 100%;">
                <tr ng-repeat="row in $data" class="contentTr" style="display: table;width:100%;table-layout:fixed;">
                    <td width="5%">{{$index + 1}}</td>
                    <td width="15%">{{row.groupName}}</td>
                    <td width="60%">
                        <ul class="nav nav-pills">
                            <li role="presentation" class="staff-li" ng-repeat="staff in row.staffList"><a href="javascript:void(0)">{{staff.name}}</a></li>
                        </ul>
                        <!--<button type="button" style="margin-left: 3px" class="btn btn-info" ng-repeat="staff in row.staffList">{{staff.name}}</button>-->
                    </td>
                    <td width="15%">
                        <button type="button" class="btn btn-danger btn-small" ng-click="deleteGroup(row.groupId)"><i class="icon-remove"></i>删除</button>
                        <button type="button" class="btn btn-info btn-small edit-group" data-id="${group.id}" ng-click="toEditGroup($index)"><i class="icon-pencil"></i>编辑</button>
                    </td>
                </tr>
                </tbody>
            </table>

        </div>

        <div class="modal fade" id="groupModal" tabindex="-1" role="dialog" aria-labelledby="ApproveModalLabel">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <button type="button" class="closeTable" data-dismiss="modal" aria-label="Close"></button>
                        <h4 class="modal-title" id="ApproveModalLabel">组信息</h4>
                    </div>
                    <div class="modal-body" style="min-height: 138px">
                        <form class="form-horizontal" name="gForm">
                            <input type="hidden" ng-model="formData.groupId">
                            <div class="form-group" ng-class="{ 'has-error' : gForm.groupName.$invalid && !gForm.groupName.$pristine }">
                                <label for="groupName" class="col-sm-3 control-label">组名：<span style="color: red;">*</span></label>
                                <div class="col-sm-9">
                                    <input type="text" id="groupName" name="groupName" placeholder="请输入组名" class="form-control" ng-model="formData.groupName" required>
                                    <p ng-show="gForm.groupName.$invalid && !gForm.groupName.$pristine" class="help-block">请输入组名</p>
                                </div>
                            </div>

                            <div class="form-group">
                                <label  class="col-sm-3 control-label">成员选择：<span style="color: red;">*</span></label>
                                <div class="col-sm-9">
                                    <div style="min-width: 153px" isteven-multi-select input-model="staffs" output-model="selectStaffs"
                                         button-label="name" item-label="name" tick-property="ticked"
                                         translation="localLang" max-labels="8" helper-elements="all none filter" max-height="350px">
                                    </div>
                                </div>
                            </div>
                        </form>

                    </div>
                    <div class="modal-footer">
                        <button type="button" class="cancel" data-dismiss="modal">取消</button>
                        <button type="button" class="sure"
                                ng-disabled="gForm.groupName.$invalid" ng-click="submitGroup()">提交
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    $(function(){
        $(".modal").draggable({cursor: "move", handle: ".modal-header"});
    });
</script>
