    </div>


    </div>
    <div class="modal fade" id="updatePwdModal" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="closeTable" data-dismiss="modal" aria-label="Close"></button>
                    <h4 class="modal-title">修改密码</h4>
                </div>
                <div class="modal-body" style="height: 220px;">
                    <form name="userAddForm" novalidate>
                        <table width="90%">
                            <tr style="border-bottom:none">
                                <td width="30%">原始密码:</td>
                                <td width="70%"><input type="password" name="pass" class=" form-control" ng-model="pass"
                                                       style="float:right;" required/>
                                </td>
                                <td width="10%"><span style="color: red;margin-left: 5px">*</span></td>
                            </tr>
                            <tr style="border-bottom:none">
                                <td width="30%">新密码:</td>
                                <td width="70%"><input type="password" name="newpass" class=" form-control"
                                                       ng-model="newpass"
                                                       style="float:right;" required/>
                                </td>
                                <td width="10%"><span style="color: red;margin-left: 5px">*</span></td>
                            </tr>
                            <tr style="border-bottom:none">
                                <td width="30%">确认密码:</td>
                                <td width="60%"><input type="password" name="repass" class=" form-control"
                                                       ng-model="repass"
                                                       style="float:right;" required/>
                                </td>
                                <td width="10%"><span style="color: red;margin-left: 5px">*</span></td>
                            </tr>
                        </table>
                    </form>
                    <div class="noneDiv"></div>
                    <div class="modal-footer">
                        <button type="button" class="cancel" data-dismiss="modal">取消</button>
                        <button type="button" class="sure"
                                ng-disabled="userAddForm.repass.$invalid||userAddForm.newpass.$invalid||userAddForm.pass.$invalid"
                                ng-click="updatePass()">保存
                        </button>
                    </div>

                </div>
            </div>
            <!--<div style="float:right;width: 28px;height: 80px;background: url('images/dowd_hover_bg.png')"><img src="images/down.png"></div>
            <div style="float:right;width: 113px;height: 80px;"><a href="#" style="float:right;line-height: 80px;color: #333333;text-decoration: none;">admin</a></div>
            <div style="float:right;"><img src="images/icons/right_disabled.png" style="padding: 32px 22px 32px 22px;"></div>-->
        </div>
    </div>
</div>

        </div>
