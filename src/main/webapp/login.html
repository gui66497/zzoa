    <script type="text/javascript">
    </script>
    <style>
       *{
           margin: 0;
           padding: 0;
           -webkit-user-select:none;
           -moz-user-select:none;
           -ms-user-select:none;
           user-select:none;
       }
        #loginTitle{
            position: absolute;
            z-index: 9999;
            color: #f1ebe5;
            font-size: 50px;
            text-shadow: 0 3px 5px #c4b59d, 0px -1px 1px #fff;
            margin-top: -100px;
        }
    </style>
</head>
<body onload="validBrowser()">
<div ng-controller="loginController">

    <div class="modal fade" id="loginModal" class="modal fade" tabindex="-1" role="dialog" ng-keyup="mykeyup($event)" data-backdrop="static" data-keyboard="false" style="left: 50%;margin-left:-150px;overflow: hidden">
        <div class="modal-dialog" role="document" style="width: 100%;height: 290px;">
            <div class="modal-content">
                <h1 id="loginTitle">君智OA系统</h1>
                <div style="padding-top: 10px;text-align: center;">
                    <img src="./images/logo60x60.jpg" style="width: 50px;height: 50px;margin-top: 15px;"/>
                </div>
                <form name="loginForm">
                    <div class="modal-body">
                        <table id="loginTable" width="100%">
                            <tr style="height:70px;">
                                <td ><input type="text" maxlength="20" id="loginUserName" required ng-model="user.userName" placeholder="用户名" style="width:220px;border: none;border-bottom: 1px #dddddd solid;height:40px; background: url(images/user.png) no-repeat 10px 10px; padding-left: 35px;margin-left: 20px;" ng-focus="loginUser()" ng-style="loginUserStyle"/></td>
                            </tr>
                            <tr style="height:60px;">
                                <td ><input type="password" maxlength="20" required ng-model="user.password"  placeholder="密码" style="width:220px;border: none;border-bottom: 1px #dddddd solid;height:40px; background: url(images/password.png) no-repeat 10px 10px; padding-left: 35px;margin-left: 20px;" ng-focus="loginUser2()" ng-style="loginUserStyle2"/></td>
                            </tr>
                        </table>
                    </div>
                    <div class="alert alert-danger alert-dismissable" id="loginErrorMsg" style="display:none;height:12px;width: 73%;position:absolute;top:220px;left: 36px;line-height:2px;font-size:12px;">用户名或密码不正确！</div>
                    <div class="modal-footer" style="text-align: center;border-top: none">
                        <button type="button"  class="btn btn-success" style="border-radius:4px; width:220px;height:40px;" ng-click="login()"  ng-disabled="loginForm.$invalid">
                            <span style="font-family: 微软雅黑;">登&nbsp;&nbsp;&nbsp;&nbsp;录</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>
<!--<div class="modal-backdrop fade in" id="login"></div>-->
</body>
</html>
<script>

    function validBrowser(){
        var u_agent = navigator.userAgent;
        var browser_name='Failed to identify the browser';
        if(u_agent.indexOf('Firefox')>-1){
            browser_name='Firefox';
            alert("请使用谷歌游览器或360极速模式")
        }else if(u_agent.indexOf('Chrome')>-1){
            browser_name='Chrome';
        }else if(u_agent.indexOf('Trident')>-1&&u_agent.indexOf('rv:11')>-1){
            browser_name='IE11';
            alert("请使用谷歌游览器或360极速模式")
        }else if(u_agent.indexOf('MSIE')>-1&&u_agent.indexOf('Trident')>-1){
            browser_name='IE(8-10)';
            alert("请使用谷歌游览器或360极速模式")
        }else if(u_agent.indexOf('MSIE')>-1){
            browser_name='IE(6-7)';
            alert("请使用谷歌游览器或360极速模式")
        }else if(u_agent.indexOf('Opera')>-1){
            browser_name='Opera';
            alert("请使用谷歌游览器或360极速模式")
        }else{
            browser_name+=',info:'+u_agent;
            alert("请使用谷歌游览器或360极速模式")
        }
    }
</script>
